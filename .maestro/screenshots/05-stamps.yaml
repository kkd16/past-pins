appId: io.github.kkd16.pastpins
---
- launchApp:
    permissions:
      all: deny
- openLink: "past-pins:///stamps"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Search stamps"
    timeout: 30000
- assertVisible: "Collected"
- assertVisible: "Argentina, Collected"
- assertVisible: "Australia, Collected"
- waitForAnimationToEnd:
    timeout: 5000
