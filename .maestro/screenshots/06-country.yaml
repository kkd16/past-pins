appId: io.github.kkd16.pastpins
---
- launchApp:
    permissions:
      all: deny
- openLink: "past-pins:///country/jp"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Cities in Japan"
    timeout: 30000
- swipe:
    start: "50%, 37%"
    end: "50%, 8%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Japan, Asia, Visited"
- assertVisible: "Enlarge stamp for Japan"
