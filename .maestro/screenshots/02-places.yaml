appId: io.github.kkd16.pastpins
---
- launchApp:
    permissions:
      all: deny
- openLink: "past-pins:///countries?mode=countries&scope=visited&location=continent%3AEU&intent=release"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Austria, Visited"
    timeout: 30000
- assertVisible: "Places"
- assertVisible: "Countries"
- assertVisible: "Regions"
- assertVisible: "Cities"
- waitForAnimationToEnd:
    timeout: 5000
