name: Release iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-production-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun run verify

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ios-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build on EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret to the ios-release environment."
            exit 1
          fi
          umask 077
          if ! bunx eas-cli@24.13.0 build --platform ios --profile production --non-interactive --freeze-credentials --wait --json > "$RUNNER_TEMP/eas-build.json" 2> "$RUNNER_TEMP/eas-build.log"; then
            echo "::error::EAS build failed. Check the build logs in your Expo dashboard."
            exit 1
          fi
          if ! build_id="$(jq -er '.[0].id' "$RUNNER_TEMP/eas-build.json" 2> "$RUNNER_TEMP/eas-build-result.log")"; then
            echo "::error::EAS did not return a build ID. Check your Expo dashboard."
            exit 1
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Submit this build to App Store Connect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          umask 077
          if ! bunx eas-cli@24.13.0 submit --platform ios --profile production --id "$BUILD_ID" --non-interactive --wait > "$RUNNER_TEMP/eas-submit.log" 2>&1; then
            echo "::error::EAS submission failed. Check the submission logs in your Expo dashboard. Retry submission with the completed build ID instead of rebuilding."
            exit 1
          fi
          echo "Uploaded to App Store Connect. After Apple finishes processing, test through TestFlight and complete App Review and release in App Store Connect." >> "$GITHUB_STEP_SUMMARY"
